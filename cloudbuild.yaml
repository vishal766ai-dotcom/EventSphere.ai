steps:
  # 1. Install & Run Automated Integration Tests
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    id: 'install-deps'

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['test']
    id: 'run-tests'

  # 2. Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/eventsphere-app:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/eventsphere-app:latest',
      '.'
    ]
    id: 'build-image'

  # 3. Push Docker Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eventsphere-app:$COMMIT_SHA']
    id: 'push-image'

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'eventsphere-service',
      '--image', 'gcr.io/$PROJECT_ID/eventsphere-app:$COMMIT_SHA',
      '--region', 'asia-south1', # Mumbai / Bangalore region
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--set-env-vars', 'NODE_ENV=production',
      '--port', '8080'
    ]
    id: 'deploy-cloud-run'

images:
  - 'gcr.io/$PROJECT_ID/eventsphere-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/eventsphere-app:latest'

timeout: '900s'
